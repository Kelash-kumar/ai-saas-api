$kind: http-request
description: ''
url: '{{baseUrl}}/api/v1/auth/me'
method: GET
headers:
  Accept: application/json
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 401', function () { pm.response.to.have.status(401); });
      pm.test('Auth responses are not cached', function () { pm.expect(pm.response.headers.get('Cache-Control')).to.eql('no-store'); });
    language: text/javascript
order: 1000
