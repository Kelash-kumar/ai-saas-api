$kind: http-request
description: ''
url: '{{baseUrl}}/api/v1/auth/csrf'
method: POST
headers:
  Accept: application/json
  Origin: https://untrusted.example.test
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 403', function () { pm.response.to.have.status(403); });
      pm.test('Auth responses are not cached', function () { pm.expect(pm.response.headers.get('Cache-Control')).to.eql('no-store'); });
    language: text/javascript
order: 2000
