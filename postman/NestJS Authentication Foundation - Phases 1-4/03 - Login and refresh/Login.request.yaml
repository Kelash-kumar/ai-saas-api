$kind: http-request
description: ''
url: '{{baseUrl}}/api/v1/auth/login'
method: POST
headers:
  Accept: application/json
  Origin: '{{origin}}'
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "password": "{{password}}",
      "deviceName": "{{deviceName}}"
    }
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: |-
      const required = ["email","password","deviceName"];
      for (const key of required) {
        const value = pm.variables.get(key);
        if (typeof value !== 'string' || value.length === 0) {
          if (pm.execution && typeof pm.execution.skipRequest === 'function') pm.execution.skipRequest();
          throw new Error('Set '+key+' first. See docs/WORKING-GUIDE.md; obtain mail tokens through mail or the private preview commands.');
        }
      }
      pm.request.body.update(JSON.stringify({"email": pm.variables.get("email"), "password": pm.variables.get("password"), "deviceName": pm.variables.get("deviceName")}));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', function () { pm.response.to.have.status(200); });
      pm.test('Auth responses are not cached', function () { pm.expect(pm.response.headers.get('Cache-Control')).to.eql('no-store'); });
      function setInput(key, value) {
        if (pm.environment.has(key)) pm.environment.set(key, value);
        else pm.collectionVariables.set(key, value);
      }
      function clearSession() {
        ['accessToken','csrfToken','sessionId','targetSessionId','sessionIds'].forEach(key => pm.collectionVariables.unset(key));
      }
      if (pm.response.code === 200) {
      const data = pm.response.json().data;
      pm.test('Credentials match the response contract', function () {
        pm.expect(data.accessToken).to.be.a('string').and.not.empty;
        pm.expect(data.csrfToken).to.match(/^[A-Za-z0-9_-]{43}$/);
        pm.expect(data.sessionId).to.be.a('string').and.not.empty;
        pm.expect(data.expiresIn).to.be.above(0);
        pm.expect(data).not.to.have.property('refreshToken');
      });
      pm.collectionVariables.set('accessToken', data.accessToken);
      pm.collectionVariables.set('csrfToken', data.csrfToken);
      pm.collectionVariables.set('sessionId', data.sessionId);
      pm.test('HttpOnly refresh cookie issued', function () {
        const cookies = pm.response.headers.all().filter(header => header.key.toLowerCase() === 'set-cookie');
        pm.expect(cookies.some(header => /(?:__Host-)?foundation_refresh=/.test(header.value) && /HttpOnly/i.test(header.value))).to.eql(true);
      });
      }
    language: text/javascript
order: 1000
