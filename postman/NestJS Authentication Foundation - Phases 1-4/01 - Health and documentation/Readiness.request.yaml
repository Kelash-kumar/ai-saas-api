$kind: http-request
description: ''
url: '{{baseUrl}}/api/v1/health/ready'
method: GET
headers:
  Accept: application/json
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', function () { pm.response.to.have.status(200); });
      function setInput(key, value) {
        if (pm.environment.has(key)) pm.environment.set(key, value);
        else pm.collectionVariables.set(key, value);
      }
      function clearSession() {
        ['accessToken','csrfToken','sessionId','targetSessionId','sessionIds'].forEach(key => pm.collectionVariables.unset(key));
      }
      if (pm.response.code === 200) {
      pm.test('Database and application ready', function () { const data = pm.response.json(); pm.expect(data.status).to.eql('ok'); pm.expect(data.info.database.status).to.eql('up'); });
      }
    language: text/javascript
order: 2000
