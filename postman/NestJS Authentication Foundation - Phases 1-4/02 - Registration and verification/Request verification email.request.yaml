$kind: http-request
description: Optional resend. At most one verification token per recipient per minute.
url: '{{baseUrl}}/api/v1/auth/verification/request'
method: POST
headers:
  Accept: application/json
  Origin: '{{origin}}'
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}"
    }
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: |-
      const required = ["email"];
      for (const key of required) {
        const value = pm.variables.get(key);
        if (typeof value !== 'string' || value.length === 0) {
          if (pm.execution && typeof pm.execution.skipRequest === 'function') pm.execution.skipRequest();
          throw new Error('Set '+key+' first. See docs/WORKING-GUIDE.md; obtain mail tokens through mail or the private preview commands.');
        }
      }
      pm.request.body.update(JSON.stringify({"email": pm.variables.get("email")}));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 202', function () { pm.response.to.have.status(202); });
      pm.test('Auth responses are not cached', function () { pm.expect(pm.response.headers.get('Cache-Control')).to.eql('no-store'); });
      function setInput(key, value) {
        if (pm.environment.has(key)) pm.environment.set(key, value);
        else pm.collectionVariables.set(key, value);
      }
      function clearSession() {
        ['accessToken','csrfToken','sessionId','targetSessionId','sessionIds'].forEach(key => pm.collectionVariables.unset(key));
      }
      if (pm.response.code === 202) {
      pm.test('Generic accepted response', function () {
        const body = pm.response.json(); pm.expect(body.success).to.eql(true); pm.expect(body.data.message).to.be.a('string');
      });
      }
    language: text/javascript
order: 2000
