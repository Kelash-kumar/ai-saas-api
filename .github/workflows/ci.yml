name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: auth_foundation
          POSTGRES_USER: foundation
          POSTGRES_PASSWORD: ci-only-disposable-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U foundation -d auth_foundation"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      NODE_ENV: test
      LOG_LEVEL: silent
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 5432
      DATABASE_NAME: auth_foundation
      DATABASE_USER: foundation
      DATABASE_PASSWORD: ci-only-disposable-password
      DATABASE_SSL: 'false'
      AUTH_JWT_KEY: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
      AUTH_CSRF_KEY: AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgI=
      AUTH_OUTBOX_KEY: AwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwM=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run db:migrate
      - run: npm run db:schema-check
      - run: npm run check:all
      - run: npm audit --omit=dev --audit-level=moderate
